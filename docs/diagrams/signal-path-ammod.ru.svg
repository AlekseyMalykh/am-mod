<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1070" viewBox="0 0 1500 1070" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="48" font-size="26" font-weight="700" fill="#102a43" text-anchor="start">Режим Am MOD: путь звука</text><text x="40" y="76" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">Микшер A–H и Master заменяет штатный FX Selection. Штатные эффекты FX Select в этом режиме не применяются.</text><text x="40" y="118" font-size="17" font-weight="700" fill="#102a43" text-anchor="start">1. Воспроизведение</text><line x1="40" y1="125" x2="1460" y2="125" stroke="#bcccdc" stroke-width="1.5"/><rect x="40" y="165" width="140" height="100" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2"/><text x="110.0" y="211.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Пэды /</text><text x="110.0" y="229.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">секвенсор</text><rect x="215" y="165" width="200" height="100" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="315.0" y="202.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Окно Sample</text><text x="315.0" y="220.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Trim · Tune · Filter</text><text x="315.0" y="238.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Envelope · Level · Pan</text><rect x="450" y="165" width="200" height="100" rx="9" fill="#fff3d6" stroke="#c98a0b" stroke-width="2"/><text x="550.0" y="202.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Назначение</text><text x="550.0" y="220.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Pad FX: трек A–H</text><text x="550.0" y="238.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">или Direct</text><rect x="700" y="132" width="260" height="90" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="830.0" y="164.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Трек A–H</text><text x="830.0" y="182.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Track FX · Fader · Pan</text><text x="830.0" y="200.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Mute / Solo · Send</text><rect x="700" y="245" width="260" height="56" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 4"/><text x="830.0" y="278.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Direct: мимо треков</text><rect x="1000" y="165" width="130" height="100" rx="9" fill="#e4f5e8" stroke="#2f8f4e" stroke-width="2"/><text x="1065.0" y="211.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Master</text><text x="1065.0" y="229.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Master FX</text><rect x="1165" y="165" width="120" height="100" rx="9" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="1225.0" y="220.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Компрессор</text><rect x="1320" y="165" width="140" height="100" rx="9" fill="#2d3540" stroke="#1b2027" stroke-width="2"/><text x="1390.0" y="211.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Master volume</text><text x="1390.0" y="229.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">→ Выходы</text><polyline points="180,215 215,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="415,215 450,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="650,215 675,215 675,177 700,177" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="650,215 675,215 675,273 700,273" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="960,177 980,177 980,215 1000,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="960,273 980,273 980,215 1000,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1130,215 1165,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1285,215 1320,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><text x="40" y="352" font-size="17" font-weight="700" fill="#102a43" text-anchor="start">2. Запись входа</text><line x1="40" y1="359" x2="1460" y2="359" stroke="#bcccdc" stroke-width="1.5"/><rect x="40" y="405" width="170" height="100" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2"/><text x="125.0" y="451.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Вход</text><text x="125.0" y="469.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Mic / USB / Rear</text><rect x="250" y="405" width="290" height="100" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="395.0" y="442.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Rear (только Rear)</text><text x="395.0" y="460.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Rear L · Rear R · Split · L+R Mix</text><text x="395.0" y="478.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Pan и Level L/R</text><rect x="580" y="405" width="240" height="100" rx="9" fill="#fff3d6" stroke="#c98a0b" stroke-width="2"/><text x="700.0" y="442.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Input FX</text><text x="700.0" y="460.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">цепочка из 4 слотов</text><text x="700.0" y="478.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">общая для Mic/USB/Rear</text><rect x="870" y="405" width="270" height="100" rx="9" fill="#efe7fa" stroke="#7c4dbd" stroke-width="2"/><text x="1005.0" y="451.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Запись на пэд</text><text x="1005.0" y="469.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">FX и Pan/Level входят в WAV</text><rect x="580" y="540" width="240" height="46" rx="9" fill="#2d3540" stroke="#1b2027" stroke-width="2" stroke-dasharray="6 4"/><text x="700.0" y="568.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Мониторинг → Выходы</text><polyline points="210,455 250,455" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="540,455 580,455" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="820,455 870,455" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="125,405 125,392 700,392 700,405" fill="none" stroke="#52606d" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="140" y="384" font-size="12" font-weight="400" fill="#52606d" text-anchor="start" font-style="italic">Mic и USB идут напрямую в Input FX (Rear-регуляторы к ним не применяются)</text><polyline points="700,505 700,540" fill="none" stroke="#52606d" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="40" y="645" font-size="17" font-weight="700" fill="#102a43" text-anchor="start">3. Ресемплинг</text><line x1="40" y1="652" x2="1460" y2="652" stroke="#bcccdc" stroke-width="1.5"/><rect x="40" y="680" width="230" height="110" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2"/><text x="155.0" y="722.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Shift + Pad 11</text><text x="155.0" y="740.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">экран Sample → сэмпл</text><text x="155.0" y="758.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">экран секвенции → секвенция</text><rect x="300" y="680" width="190" height="110" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="395.0" y="722.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Окно Sample</text><text x="395.0" y="740.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Trim · Tune · Filter</text><text x="395.0" y="758.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Envelope · Level · Pan</text><rect x="520" y="680" width="200" height="110" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="620.0" y="731.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Трек пэда</text><text x="620.0" y="749.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">(если пэд на треке)</text><rect x="750" y="680" width="170" height="110" rx="9" fill="#e4f5e8" stroke="#2f8f4e" stroke-width="2"/><text x="835.0" y="740.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Master FX</text><rect x="950" y="680" width="150" height="110" rx="9" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="1025.0" y="740.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Компрессор</text><rect x="1130" y="680" width="150" height="110" rx="9" fill="#efe7fa" stroke="#7c4dbd" stroke-width="2"/><text x="1205.0" y="731.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">WAV</text><text x="1205.0" y="749.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">(рендер)</text><rect x="1310" y="680" width="150" height="110" rx="9" fill="#efe7fa" stroke="#7c4dbd" stroke-width="2"/><text x="1385.0" y="731.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Целевой</text><text x="1385.0" y="749.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">пэд</text><polyline points="270,735 300,735" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="490,735 520,735" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="720,735 750,735" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="920,735 950,735" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1100,735 1130,735" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1280,735 1310,735" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><text x="40" y="850" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Режим выбирается в Project → Mod Settings → Quick → FX mode; применяется после перезапуска.</text><text x="40" y="876" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Пэд, назначенный на трек, проходит эффекты трека; пэд на Direct идёт сразу в Master.</text><text x="40" y="902" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Ресемплинг сэмпла и секвенции проходит тот же путь, что и воспроизведение: Sample → трек → Master → компрессор.</text><text x="40" y="928" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Уровень результата ресемплинга зависит от фейдеров дорожки и мастера.</text><text x="40" y="954" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Записанный сэмпл при воспроизведении снова проходит свой трек: для первой проверки используйте Direct.</text><text x="40" y="980" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Запись идёт со входа (до микшера); эффекты треков и Master в запись не попадают.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>