<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="48" font-size="26" font-weight="700" fill="#102a43" text-anchor="start">Режим Stock: путь звука</text><text x="40" y="76" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">Штатная маршрутизация и штатный FX Selection. Микшер и цепочка Input FX обходятся.</text><text x="40" y="118" font-size="17" font-weight="700" fill="#102a43" text-anchor="start">1. Воспроизведение</text><line x1="40" y1="125" x2="1460" y2="125" stroke="#bcccdc" stroke-width="1.5"/><rect x="40" y="165" width="150" height="100" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2"/><text x="115.0" y="211.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Пэды /</text><text x="115.0" y="229.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">секвенсор</text><rect x="230" y="165" width="230" height="100" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="345.0" y="202.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Окно Sample</text><text x="345.0" y="220.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Trim · Tune · Filter</text><text x="345.0" y="238.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Envelope · Level · Pan</text><rect x="520" y="132" width="250" height="90" rx="9" fill="#fff3d6" stroke="#c98a0b" stroke-width="2"/><text x="645.0" y="155.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">FX Select</text><text x="645.0" y="173.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">выбранные пэды:</text><text x="645.0" y="191.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">LP/BP Filter, Bus Comp,</text><text x="645.0" y="209.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Limiter, Pumper …</text><rect x="520" y="245" width="250" height="56" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 4"/><text x="645.0" y="269.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Остальные пэды</text><text x="645.0" y="287.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">без эффекта</text><rect x="830" y="165" width="170" height="100" rx="9" fill="#e4f5e8" stroke="#2f8f4e" stroke-width="2"/><text x="915.0" y="211.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Главная шина</text><text x="915.0" y="229.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Program main</text><rect x="1040" y="165" width="150" height="100" rx="9" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="1115.0" y="220.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Компрессор</text><rect x="1230" y="165" width="230" height="100" rx="9" fill="#2d3540" stroke="#1b2027" stroke-width="2"/><text x="1345.0" y="211.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Master volume</text><text x="1345.0" y="229.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">→ Выходы</text><polyline points="190,215 230,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="460,215 490,215 490,177 520,177" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="460,215 490,215 490,273 520,273" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="770,177 800,177 800,215 830,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="770,273 800,273 800,215 830,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1000,215 1040,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1190,215 1230,215" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><text x="40" y="352" font-size="17" font-weight="700" fill="#102a43" text-anchor="start">2. Запись входа</text><line x1="40" y1="359" x2="1460" y2="359" stroke="#bcccdc" stroke-width="1.5"/><rect x="40" y="370" width="190" height="100" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2"/><text x="135.0" y="416.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Вход</text><text x="135.0" y="434.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Mic / USB / Rear</text><rect x="290" y="370" width="300" height="100" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="440.0" y="407.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Sample Record</text><text x="440.0" y="425.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">штатная запись</text><text x="440.0" y="443.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Source · Rec Length · Monitor</text><rect x="650" y="370" width="220" height="100" rx="9" fill="#efe7fa" stroke="#7c4dbd" stroke-width="2"/><text x="760.0" y="416.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Новый сэмпл</text><text x="760.0" y="434.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">на пэде (WAV)</text><rect x="290" y="505" width="300" height="46" rx="9" fill="#2d3540" stroke="#1b2027" stroke-width="2" stroke-dasharray="6 4"/><text x="440.0" y="533.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Мониторинг → Выходы</text><polyline points="230,420 290,420" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="590,420 650,420" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="135,470 135,528 290,528" fill="none" stroke="#52606d" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="40" y="600" font-size="17" font-weight="700" fill="#102a43" text-anchor="start">3. Ресемплинг</text><line x1="40" y1="607" x2="1460" y2="607" stroke="#bcccdc" stroke-width="1.5"/><rect x="40" y="635" width="260" height="110" rx="9" fill="#eceff3" stroke="#7b8794" stroke-width="2"/><text x="170.0" y="677.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Shift + Pad 11</text><text x="170.0" y="695.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">экран Sample → сэмпл</text><text x="170.0" y="713.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">экран секвенции → секвенция</text><rect x="340" y="635" width="220" height="110" rx="9" fill="#e3f0fb" stroke="#3b82c4" stroke-width="2"/><text x="450.0" y="677.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Окно Sample</text><text x="450.0" y="695.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Trim · Tune · Filter</text><text x="450.0" y="713.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">Envelope · Level · Pan</text><rect x="600" y="635" width="220" height="110" rx="9" fill="#fff3d6" stroke="#c98a0b" stroke-width="2"/><text x="710.0" y="686.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">FX Select</text><text x="710.0" y="704.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">выбранные пэды</text><rect x="860" y="635" width="150" height="110" rx="9" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="935.0" y="695.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Компрессор</text><rect x="1050" y="635" width="150" height="110" rx="9" fill="#efe7fa" stroke="#7c4dbd" stroke-width="2"/><text x="1125.0" y="686.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">WAV</text><text x="1125.0" y="704.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">(рендер)</text><rect x="1240" y="635" width="150" height="110" rx="9" fill="#efe7fa" stroke="#7c4dbd" stroke-width="2"/><text x="1315.0" y="686.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Целевой</text><text x="1315.0" y="704.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">пэд</text><polyline points="300,690 340,690" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="560,690 600,690" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="820,690 860,690" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1010,690 1050,690" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><polyline points="1200,690 1240,690" fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#ah)"/><text x="40" y="800" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Режим выбирается в Project → Mod Settings → Quick → FX mode; применяется после перезапуска.</text><text x="40" y="826" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Эффекты, назначенные в FX Select, сохраняются в проекте и не влияют на звук режима Am MOD.</text><text x="40" y="852" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Ресемплинг включает окно Sample, FX Select и компрессор, то есть результат звучит так же, как воспроизведение.</text><text x="40" y="878" font-size="14" font-weight="400" fill="#334e68" text-anchor="start">• Запись и ресемплинг в Stock работают штатно: функции микшера и Input FX не используются.</text></svg>